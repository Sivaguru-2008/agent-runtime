name: agent-fence CI

on:
  push:
    paths:
      - "agent-fence/**"
      - ".github/workflows/agent-fence-ci.yml"
  pull_request:
    paths:
      - "agent-fence/**"
      - ".github/workflows/agent-fence-ci.yml"

defaults:
  run:
    working-directory: agent-fence

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    name: Node ${{ matrix.node }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: agent-fence/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
