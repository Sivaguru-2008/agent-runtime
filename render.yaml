# Render.com blueprint for the Agent Runtime API + managed Postgres.
#
# Deploy: push this file, then in the Render dashboard "New > Blueprint" and
# point it at this repo. Render provisions the database, injects DATABASE_URL,
# and builds the Docker image. Set the secret env vars marked sync:false in the
# dashboard (GROQ_API_KEY etc). See docs/deploy.md for the runbook + owner-key
# seeding step.

databases:
  - name: agent-runtime-db
    databaseName: agents_runtime
    user: agents
    plan: basic-256mb   # bump to a paid plan before inviting design partners

services:
  - type: web
    name: agent-runtime-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: API_HOST
        value: "::"
      - key: PERSISTENCE_DRIVER
        value: postgres
      - key: EVENT_STORE_DRIVER
        value: postgres
      - key: EVENT_BUS_DRIVER
        value: memory
      - key: RUNTIME_MODE
        value: single
      - key: AUTH_ENABLED
        value: "true"
      - key: DATABASE_SSL
        value: require
      - key: SHUTDOWN_DRAIN_TIMEOUT_MS
        value: "25000"
      # Render injects the managed DB connection string here automatically.
      - key: DATABASE_URL
        fromDatabase:
          name: agent-runtime-db
          property: connectionString
      # Resilient provider chain — a Groq outage degrades to deterministic
      # instead of 500ing the runloop. Set the key in the dashboard.
      - key: MODEL_PROVIDER
        value: failover
      - key: MODEL_FAILOVER_CHAIN
        value: groq,deterministic
      - key: GROQ_API_KEY
        sync: false
